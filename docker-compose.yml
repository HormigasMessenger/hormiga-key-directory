services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hormiga
      POSTGRES_PASSWORD: hormiga
      POSTGRES_DB: hormiga_keys
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hormiga -d hormiga_keys"]
      interval: 3s
      timeout: 3s
      retries: 10

  keydirectory:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KD_ADDR: ":8092"
      KD_DATABASE_URL: "postgres://hormiga:hormiga@postgres:5432/hormiga_keys"
      KD_AUTO_MIGRATE: "true"
    ports:
      - "8092:8092"
