name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hormiga
          POSTGRES_PASSWORD: hormiga
          POSTGRES_DB: hormiga_keys
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hormiga -d hormiga_keys"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      KD_TEST_DATABASE_URL: postgres://hormiga:hormiga@localhost:5433/hormiga_keys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -v
